<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact me - 183149 - Moaed Alomari</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <span class="brand">Moaed Alomari</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html" class="active">Contact me</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Contact me</h1>
      <p>Fill in the form below and I will get back to you.</p>

      <form id="contactForm" novalidate>
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName">

        <label for="email">Email address</label>
        <input type="email" id="email" name="email">

        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select your country</option>
          <option>Jordan</option>
          <option>Saudi Arabia</option>
          <option>United Arab Emirates</option>
          <option>Egypt</option>
          <option>Palestine</option>
          <option>Lebanon</option>
          <option>Iraq</option>
          <option>Syria</option>
          <option>Kuwait</option>
          <option>Qatar</option>
          <option>United States</option>
          <option>United Kingdom</option>
          <option>Germany</option>
          <option>Other</option>
        </select>

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5"></textarea>

        <p id="errorMessage" class="error" role="alert"></p>
        <button type="submit" class="button">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Moaed Alomari &middot; Jordan University of Science and Technology</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
